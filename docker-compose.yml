# AI 面试 Agent — M4 部署
# 启动所有基础设施服务，前后端本地跑（hot reload）
#
# Usage:
#   docker compose up -d          # 启动 PG + Redis + LiveKit
#   cd backend && uvicorn app.main:app --reload
#   cd frontend && npm run dev

version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interview
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── LiveKit Server ──────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.7
    command: >
      --config-body="
      port: 7880
      rtc:
        tcp_port: 7881
        udp_port: 7882
        port_range_start: 50000
        port_range_end: 50100
      keys:
        devkey: secret
      "
    ports:
      - "7880:7880"   # WebSocket (primary API)
      - "7881:7881"   # TCP fallback
      - "7882:7882/udp"  # UDP media
      - "50000-50100:50000-50100/udp"  # UDP media range
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
